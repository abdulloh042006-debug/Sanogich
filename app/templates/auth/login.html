{% extends "base.html" %}
{% block title %}Sign in — Sanogich{% endblock %}

{% block content %}
<div class="auth-card">
  <h1>Welcome back</h1>
  <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}" class="form" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label class="field">
      <span class="field-label">Email or username</span>
      <input type="text" name="identity" required autocomplete="username"
             value="{{ request.form.get('identity', '') }}" placeholder="you@example.com">
    </label>

    <label class="field">
      <span class="field-label">Password</span>
      <input type="password" name="password" required autocomplete="current-password">
    </label>

    <label class="checkbox">
      <input type="checkbox" name="remember"> <span>Keep me signed in</span>
    </label>

    <button type="submit" class="btn btn-primary btn-block">Sign in</button>
  </form>
  <p class="auth-alt">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div>
{% endblock %}
